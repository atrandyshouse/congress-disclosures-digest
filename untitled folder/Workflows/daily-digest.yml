name: Daily Congressional Disclosure Digest

on:
  schedule:
    # Together these cover 7:00 AM Central year-round. The script checks the
    # real Central time and only sends on the correct firing, so triggering
    # twice a day is intentional -- it is what handles Daylight Saving without
    # any manual updates. The committed state file records the date of the last
    # send, so the second firing (and any GitHub scheduler lateness) cannot
    # produce a duplicate email.
    - cron: '0 12 * * *'   # 7:00 AM CDT (roughly Mar-Nov)
    - cron: '0 13 * * *'   # 7:00 AM CST (roughly Nov-Mar)
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to run'
        type: choice
        default: doctor
        options:
          - doctor      # check every credential and endpoint; send nothing
          - dry-run     # build the digest, upload it as an artifact, send nothing
          - send        # build and actually email it, ignoring the time check
          - debug       # dump raw API records to the log so field names can be checked

# Two cron firings on the same day must never overlap -- they share the state file.
concurrency:
  group: congress-digest
  cancel-in-progress: false

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write        # needed to commit state/seen.json back after a send

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run digest
        id: digest
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          LOOKBACK_DAYS: ${{ vars.LOOKBACK_DAYS || '3' }}
          INCLUDE_SENATE: ${{ vars.INCLUDE_SENATE || 'true' }}
          MIN_AMOUNT: ${{ vars.MIN_AMOUNT || '0' }}
          SEND_WHEN_EMPTY: ${{ vars.SEND_WHEN_EMPTY || 'false' }}
          MODE: ${{ github.event.inputs.mode || 'scheduled' }}
        run: |
          case "$MODE" in
            doctor)  python scripts/fetch_and_email.py --doctor ;;
            dry-run) python scripts/fetch_and_email.py --force --dry-run ;;
            debug)   python scripts/fetch_and_email.py --force --debug ;;
            send)    python scripts/fetch_and_email.py --force ;;
            *)       python scripts/fetch_and_email.py ;;
          esac

      # Only produced by the dry-run mode; harmless no-op otherwise.
      - name: Upload digest preview
        if: github.event.inputs.mode == 'dry-run'
        uses: actions/upload-artifact@v6
        with:
          name: digest-preview
          path: digest-preview.html
          if-no-files-found: warn

      - name: Persist state
        # Runs even if an earlier step failed, so a send that succeeded before a
        # later hiccup is still recorded and cannot be re-sent tomorrow.
        if: always() && github.event.inputs.mode != 'dry-run'
        run: |
          if [ -z "$(git status --porcelain -- state/ 2>/dev/null)" ]; then
            echo "No state change to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          git commit -m "chore: update digest state [skip ci]"
          # The two daily firings can race; rebase onto whatever landed first.
          for attempt in 1 2 3; do
            if git push; then
              echo "State pushed on attempt $attempt."
              exit 0
            fi
            echo "Push failed, rebasing and retrying..."
            git pull --rebase --autostash || true
          done
          echo "::warning::Could not push the state file after 3 attempts. Dedupe and the duplicate-send guard stay degraded until it succeeds."
